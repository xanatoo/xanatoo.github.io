#
# Assemble the site from xanatoo's rolling `continuous` release and deploy.
# xanatoo's artifacts workflow replaces a target's release assets only when
# that target builds, then triggers this workflow (workflow_dispatch), so
# each download goes live as soon as its build succeeds and a failed build
# keeps the previous one. Takes a minute; nothing is compiled here.

name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Fallback if a trigger from xanatoo was missed.
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel: a queued run replaces older queued ones and reads the
# release when it starts, so the last run always sees every finished build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch builds
        run: scripts/fetch-builds.sh builds

      - name: Assemble
        run: |
          scripts/assemble.sh builds site
          find site -type f -printf '%10s  %p\n' | sort -k2

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
