#
# Assemble the site with xanatoo's `site-from-release` flake app (page from
# xanatoo master's website/, downloads from its rolling `continuous`
# release, each target replaced only when its build succeeds) and deploy.
# xanatoo's CI triggers this after every published build and page edit.

name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Fallback if a trigger from xanatoo was missed.
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel: a queued run replaces older queued ones and reads the
# release when it starts, so the last run always sees every finished build.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble
        run: |
          nix run github:xanatoo/xanatoo#site-from-release -- site
          find site -type f -printf '%10s  %p\n' | sort -k2

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
