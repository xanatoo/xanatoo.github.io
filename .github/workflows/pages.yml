name: Deploy site

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Pick up new xanatoo commits: the lock is bumped before building (see Build)
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Android build needs the SDK and NDK, the R36S port a cross
      # compiler: several GB in the Nix store. Make room by removing the
      # runner's preinstalled toolchains, which the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: |
            nix-${{ runner.os }}-

      # The site shows the latest xanatoo: move the lock to its master head
      # (a no-op on pushes that already follow it).
      - name: Follow latest xanatoo
        run: nix flake update xanatoo

      - name: Build
        run: nix build --print-build-logs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: result

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
